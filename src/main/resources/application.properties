spring.datasource.url=jdbc:sqlite:./e-commerce.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-123456789
app.jwt.expiration-ms=86400000

app.admin.email=lagcompensation@admin.test
app.admin.password=123456789ww